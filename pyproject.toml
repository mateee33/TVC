[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tvc"
version = "0.1.0"
description = "TVC - research-driven crypto trading bot: data pipeline, backtester, edge research and live/paper execution"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "pyarrow>=14",
    "requests>=2.31",
    "ccxt>=4.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tvc = "tvc.cli:main"

[tool.setuptools.packages.find]
include = ["tvc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
